name: Daily LLM Alpha Suite Run

on:
  schedule:
    # 00:30 UTC Monday–Saturday
    - cron: '10 00 * * 1-6'
  workflow_dispatch:

jobs:
  run-llm-alpha-suite:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Run LLM Alpha Suite
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python trainer.py
          
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-alpha-suite-results
          path: |
            llm_alpha_*.json
            llm_alpha_breakdown_*.json
